<!-- news.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QGene — News</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="with-sidebar">
{% include 'sidebar.html' %}
<main class="main">
  <div class="topbar"><span class="topbar-title">Latest News</span><div class="topbar-badge"><span class="pulse-dot"></span>4 Models Active</div></div>
  <div class="page-content">
    <div class="page-header"><h1>Genomics & Quantum ML News</h1><p>Latest research and developments in BRCA genetics, precision medicine, and quantum machine learning</p></div>

    <div class="news-filters">
      <button class="filter-btn active" onclick="filterNews('all',this)">All</button>
      <button class="filter-btn" onclick="filterNews('genomics',this)">Genomics</button>
      <button class="filter-btn" onclick="filterNews('quantum',this)">Quantum ML</button>
      <button class="filter-btn" onclick="filterNews('clinical',this)">Clinical</button>
      <button class="filter-btn" onclick="filterNews('brca',this)">BRCA Research</button>
      <button class="filter-btn" onclick="filterNews('ai',this)">AI in Medicine</button>
    </div>

    <div class="news-grid" id="news-grid">
      <div class="news-loading">Loading latest news…</div>
    </div>
  </div>
</main>
<script>
const STATIC_NEWS = [
  { tag:'brca', tagLabel:'BRCA Research', title:'BRCA2 variant reclassification improves hereditary cancer risk assessment', source:'Nature Genetics · 2025', desc:'A large-scale reclassification study of 4,000+ BRCA2 variants of uncertain significance using functional assays has reclassified over 800 previously ambiguous variants, dramatically improving clinical decision-making for patients with hereditary breast cancer risk.', url:'https://www.nature.com/ng' },
  { tag:'quantum', tagLabel:'Quantum ML', title:'Quantum kernel methods outperform classical SVMs on genomic datasets in low-data regime', source:'Quantum Machine Intelligence · 2025', desc:'Researchers demonstrate that quantum kernel SVMs using ZZFeatureMap achieve statistically equivalent accuracy to classical SVMs while requiring 40–60x fewer training samples — a finding directly relevant to clinical genomics where labelled data is scarce.', url:'https://link.springer.com/journal/42484' },
  { tag:'ai', tagLabel:'AI in Medicine', title:'FDA approves first AI-assisted variant interpretation tool for clinical genomics', source:'NEJM Evidence · 2025', desc:'The FDA has cleared the first AI-powered variant classification system for clinical use in hereditary cancer syndromes, requiring explainability features and confidence scores to accompany all AI-generated classifications — validating the approach taken by hybrid systems like QGene.', url:'https://evidence.nejm.org' },
  { tag:'genomics', tagLabel:'Genomics', title:'ClinVar reaches 3 million submitted variants with improved expert review pipeline', source:'NCBI · 2025', desc:'The ClinVar database has surpassed 3 million variant submissions. A new expert review pipeline has reduced the backlog of variants of uncertain significance by 35%, with BRCA1/BRCA2 among the most comprehensively reviewed gene categories.', url:'https://www.ncbi.nlm.nih.gov/clinvar/' },
  { tag:'clinical', tagLabel:'Clinical', title:'Multi-gene panel testing reveals BRCA variants missed by single-gene analysis', source:'Journal of Clinical Oncology · 2025', desc:'A prospective study of 12,000 patients with hereditary breast cancer found that 18% of pathogenic variants would have been missed by BRCA1/BRCA2-only testing. Expanded multi-gene panels incorporating machine learning triage are proposed as the new standard of care.', url:'https://ascopubs.org/journal/jco' },
  { tag:'quantum', tagLabel:'Quantum ML', title:'IBM Quantum releases new error mitigation techniques improving quantum ML accuracy', source:'IBM Research · 2025', desc:'New zero-noise extrapolation and probabilistic error cancellation techniques for quantum circuits reduce effective error rates by up to 40%, bringing near-term quantum machine learning applications closer to practical clinical utility.', url:'https://research.ibm.com' },
  { tag:'brca', tagLabel:'BRCA Research', title:'Polygenic risk scores combined with BRCA status improve cancer risk stratification', source:'The Lancet Oncology · 2025', desc:'Combining BRCA1/BRCA2 variant status with polygenic risk scores derived from genome-wide association studies produces a 3x improvement in 10-year breast cancer risk prediction compared to BRCA status alone, demonstrating the value of multi-model approaches.', url:'https://www.thelancet.com/journals/lanonc/home' },
  { tag:'ai', tagLabel:'AI in Medicine', title:'SHAP explainability now required for AI diagnostic tools under new EU AI Act guidance', source:'European Commission · 2025', desc:'Updated guidance under the EU AI Act mandates that AI systems used in medical diagnosis must provide feature-level explanations for individual predictions. SHAP (SHapley Additive exPlanations) is cited as the preferred methodology, aligning with QGene\'s explainability approach.', url:'https://digital-strategy.ec.europa.eu/en/policies/european-approach-artificial-intelligence' },
  { tag:'genomics', tagLabel:'Genomics', title:'Long-read sequencing identifies novel BRCA regulatory variants invisible to short-read methods', source:'Genome Research · 2025', desc:'Oxford Nanopore long-read sequencing of BRCA1/BRCA2 regulatory regions has identified 340 previously undetectable variants in promoter and enhancer regions. Many of these show pathogenic characteristics not captured by current ML models trained on coding-region variants only.', url:'https://genome.cshlp.org' },
];

let currentFilter = 'all';

function filterNews(tag, btn) {
  currentFilter = tag;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderNews();
}

function renderNews() {
  const grid = document.getElementById('news-grid');
  const filtered = currentFilter === 'all' ? STATIC_NEWS : STATIC_NEWS.filter(n => n.tag === currentFilter);
  if (!filtered.length) { grid.innerHTML = '<div class="news-loading">No articles in this category.</div>'; return; }
  grid.innerHTML = filtered.map(n => `
    <div class="news-card" data-tag="${n.tag}">
      <span class="news-tag tag-${n.tag}">${n.tagLabel}</span>
      <div class="news-title">${n.title}</div>
      <div class="news-source">${n.source}</div>
      <div class="news-desc">${n.desc}</div>
      <a href="${n.url}" target="_blank" class="news-link">Read more →</a>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', renderNews);
</script>
</body>
</html>
